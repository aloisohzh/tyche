# Demo ids only. Real paper account ids are injected at load from the
# TYCHE_ALLOWED_ACCOUNT_IDS env/vault var and are never committed.
account_allowlist: ["SIM-DEMO-US", "SIM-TEST"]
sim_account_types: [1, 2]
sim_market_id: 100
allowed_markets: [US]
max_gross_exposure: 0.95
max_position_weight: 0.40
max_positions: 100
cap_tolerance_pct: 0.0025
min_cash_weight: 0.05
max_order_notional_pct: 0.30
# Competition-lane caps. Raised from 6 orders/50% turnover when the tactical
# lane landed (7f61baf); sells count toward the daily total, so a full ETF
# rotation can exceed 6. The 200/day competition ceiling remains the hard stop.
max_daily_turnover_pct: 1.50
max_orders_per_day: 40
competition_order_cap: 200
option_risk_per_trade_pct: 0.0075
max_option_premium_pct: 0.25
max_limit_deviation_pct: 0.03
min_order_notional: 500.0
min_price: 1.00
soft_drawdown_pct: 0.04
hard_drawdown_pct: 0.06
daily_loss_limit_pct: 0.025
risk_per_trade_pct: 0.01
allow_short: false

# Playbook registry.
#
# One row per claimed id. An id is claimed once and kept forever (L-029), so this roster is the
# authority on what exists - the table in README.md is the human-facing copy of it.
#
# Deliberately NOT duplicated here:
#   - the four classification dimensions live in each file's YAML front matter (one source);
#   - `enabled` lives in the lane's own config as its default, with the operator's override in
#     `data/strategies.json` (src/tyche/lanes.py); neither is a doc change, so this roster claims neither;
#   - the rules hash lives in the playbook body and is computed by the kernel, never hand-written.
#
# `tags:` (regime_fit, direction) appear ONLY on rows with `file: null`: a playbook file carries them in
# its front matter, and the test refuses a second copy here so the two cannot drift.
#
# `tests/test_docs_consistency.py` asserts this roster, the front matter and the config files agree.
playbooks:
  - id: PB-001
    file: playbook/PB-001-etf-rotation-ballast.md
    config: config/strategies/pb-001.yaml
    status: live

  # PB-002/PB-003 are one lane with one parameter file (src/tyche/tactical.py:243,345 stamps the ids),
  # so both freeze to config/tactical.yaml and share one hash: editing it re-registers the pair.
  # PB-002 got its thesis file on 2026-11-23 (the tactical stock lane as it actually trades). PB-003
  # got its thesis file on 2026-11-24 (long calls/puts, switched on by data/strategies.json while
  # options_enabled stays false in the yaml, so the pair keeps its hash). `status: live` requires
  # a file (test_playbook_roster_files_and_ids_agree), which is what keeps an undocumented lane from
  # being called a strategy.
  # Fixed 2026-11-20: before PLAYBOOK_LANES these two ids had no resolvable rules file at all (L-036).
  - id: PB-002
    file: playbook/PB-002-tactical-stocks.md
    config: config/tactical.yaml
    status: live

  - id: PB-003
    file: playbook/PB-003-tactical-long-options.md
    config: config/tactical.yaml
    status: live

  - id: PB-004
    file: playbook/PB-004-intraday-momentum-scalp.md
    config: config/scalp.yaml
    status: live

  - id: PB-005
    file: null
    config: null
    status: parked
    tags:
      regime_fit: [Any]
      direction: Both

  # PB-006 got its one-page plan on 2026-11-24. It stays `planned`: there is no lane and no config, so
  # nothing can trade it. Its tags moved to the file's front matter.
  - id: PB-006
    file: playbook/PB-006-sector-rotation-heat.md
    config: null
    status: planned

  # Fib 50% pullback swing lane (ADR 0017): kind fib_pullback in config/strategies/pb-007.yaml,
  # plans through the lifecycle contract. Ships enabled: false; "live" here means a pre-registered
  # file and a hashable config, the switch is the lane's own enabled key or data/strategies.json.
  - id: PB-007
    file: playbook/PB-007-fib50-pullback.md
    config: config/strategies/pb-007.yaml
    status: live
